[package]
name = "gossamer"
version = "0.1.0"
edition = "2024"

[dependencies]
witchcraft = { git = "ssh://git@github.com/dropbox/witchcraft.git", rev = "85e400c", features = ["t5-quantized"] }
regex = "1"
uuid = { version = "1", features = ["v5"] }
iso8601-timestamp = "0.4.0"

anyhow = "1"
chrono = "0.4.44"
clap = { version = "4", features = ["derive"] }
comfy-table = "7.2.2"
dirs = "5"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
crossterm = "0.29"
termimad = "0"

[dev-dependencies]
tempfile = "3"
